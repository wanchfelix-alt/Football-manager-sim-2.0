<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LifePath: Football Legacy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- START SCREEN -->
  <div id="startScreen" class="screen">
    <h1>⚽ LifePath</h1>
    <p class="tagline">A text-driven life sim with a football manager twist</p>
    <button id="newLifeBtn" class="btn btn-primary">🍼 New Life</button>
    <button id="loadBtn" class="btn">📂 Continue</button>
    <button id="careerModeBtn" class="btn">🎯 Career Mode Only (16yo Prospect)</button>
    <button id="settingsBtn" class="btn btn-secondary">⚙️ Settings</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="screen hidden">
    <header id="statBar">
      <div class="char-info">
        <span id="charName">-</span>
        <span id="charAge">Age 0</span>
      </div>
      <div class="stats">
        <div class="stat" title="Happiness">😊 <div class="bar"><div id="bar-happiness" class="fill happiness"></div></div></div>
        <div class="stat" title="Health">❤️ <div class="bar"><div id="bar-health" class="fill health"></div></div></div>
        <div class="stat" title="Smarts">🧠 <div class="bar"><div id="bar-smarts" class="fill smarts"></div></div></div>
        <div class="stat" title="Looks">✨ <div class="bar"><div id="bar-looks" class="fill looks"></div></div></div>
      </div>
      <div id="moneyDisplay">💰 $0</div>
    </header>

    <div id="clubDashboard" class="club-dashboard hidden">
      <div class="cd-toggle" id="cdToggle">📋 Club Dashboard ▾</div>
      <div class="cd-body" id="cdBody"></div>
    </div>

    <main id="eventLog"></main>

    <nav id="actionMenu">
      <div class="tabs" id="actionTabs"></div>
      <div class="action-list" id="actionList"></div>
    </nav>

    <div id="ageUpBar">
      <button id="ageUpBtn" class="btn btn-primary">⬆️ Age Up</button>
      <button id="menuBtn" class="btn btn-small">☰</button>
    </div>
  </div>

  <!-- DEATH SCREEN -->
  <div id="deathScreen" class="screen hidden">
    <h1>💀 End of Life</h1>
    <div id="deathSummary"></div>
    <button id="continueLegacyBtn" class="btn btn-primary">👶 Play as Child</button>
    <button id="newLifeAfterDeathBtn" class="btn">🍼 Start New Life</button>
  </div>

  <!-- SIDE MENU -->
  <div id="sideMenu" class="overlay hidden">
    <div class="overlay-content">
      <h2>Menu</h2>
      <button id="viewRelationshipsBtn" class="btn">👥 Relationships</button>
      <button id="viewAssetsBtn" class="btn">🏠 Assets & Bank</button>
      <button id="viewTrophyBtn" class="btn">🏆 Trophy Cabinet</button>
      <button id="viewLegacyBtn" class="btn">🌳 Family Legacy</button>
      <button id="exportBtn" class="btn">📤 Export Achievements JSON</button>
      <button id="resetBtn" class="btn btn-danger">🗑️ Reset Life</button>
      <button id="closeMenuBtn" class="btn btn-secondary">Close</button>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal" class="overlay hidden">
    <div class="overlay-content" id="modalContent"></div>
  </div>

</div>
<script type="module" src="main.js"></script>
</body>
</html>
